name: Verify public research
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install unicorn==2.1.4 numpy==1.26.4 Pillow==10.4.0 tifffile==2023.4.12
      - run: python inspect_firmware.py --self-test
      - run: python verify_findings.py --self-test
      - run: python inspect_adobe_profiles.py --self-test
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_research_program.py
